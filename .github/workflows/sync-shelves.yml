name: Sync Goodreads shelves

# Commits the shelf JSON and covers rather than fetching at build time: a
# production build runs from a clean checkout with no previous state to fall
# back to, so a Goodreads outage would ship an empty shelf. Committing the
# artifacts makes fail-soft structural. It also only deploys when the data
# actually changed. See docs/goodreads-shelf.md.

# Manual runs only, for now — trigger from the Actions tab after finishing a
# book. To go back to a daily sync, add:
#   schedule:
#     - cron: "0 6 * * *"
on:
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # Exits non-zero on an empty feed or a failed fetch, which fails the job
      # before anything is written.
      - run: npm run sync-shelves

      - name: Commit if the shelves changed
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "No changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: sync Goodreads shelves"
          git push
